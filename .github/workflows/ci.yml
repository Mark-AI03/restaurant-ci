name: Restaurant CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Lint code
        run: python -m flake8 .

      - name: Run tests
        run: python -m pytest -v

      - name: Build wheel
        run: python -m build --wheel

      - name: Check installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I - <<'PY'
          from restaurant.app import app

          app.config["TESTING"] = True
          response = app.test_client().get("/")
          assert response.status_code == 200
          assert "Python Bistro" in response.get_data(as_text=True)
          print("Installed wheel serves the restaurant page.")
          PY

      - name: Build Docker image
        run: docker build -t restaurant-ci:ci .

      - name: Test Docker container
        run: |
          docker run -d --name restaurant-test \
            -p 127.0.0.1:8000:8000 restaurant-ci:ci

          trap 'docker logs restaurant-test; docker rm -f restaurant-test' EXIT

          curl --fail --show-error \
            --retry 10 --retry-all-errors --retry-delay 2 \
            --connect-timeout 5 --max-time 10 \
            http://127.0.0.1:8000/ -o homepage.html

          grep -q "Python Bistro" homepage.html

      - name: Save wheel
        uses: actions/upload-artifact@v7
        with:
          name: restaurant-wheel
          path: dist/*.whl
          if-no-files-found: error